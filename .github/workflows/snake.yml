name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=#05d9e8&color_dots=#1a0b3b,#4a0d4f,#8f1352,#d4174f,#ff2a6d
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#05d9e8&color_dots=#1a0b3b,#4a0d4f,#8f1352,#d4174f,#ff2a6d

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
