<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260">
<style>@font-face {
  font-family: 'Orbitron';
  font-style: normal;
  font-weight: 900;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
@font-face {
  font-family: 'Share Tech Mono';
  font-style: normal;
  font-weight: 400;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
.t{font-family:'Orbitron';font-weight:900;font-size:70px;letter-spacing:6px;text-anchor:middle}
.s{font-family:'Share Tech Mono';font-size:18px;letter-spacing:2px;text-anchor:middle}
.g{animation:gl 4s infinite steps(1)}
@keyframes gl{0%,92%,100%{transform:translate(0,0)}93%{transform:translate(-6px,2px)}95%{transform:translate(5px,-2px)}97%{transform:translate(-3px,0)}}
.sc{animation:scan 5s linear infinite}
@keyframes scan{from{transform:translateY(-20px)}to{transform:translateY(280px)}}
.bl{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d0221"/><stop offset=".6" stop-color="#1a0b3b"/><stop offset="1" stop-color="#4a0420"/></linearGradient>
<linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#05d9e8"/><stop offset=".5" stop-color="#ff003c"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="sl" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.5" fill="#000" opacity=".28"/></pattern>
</defs>
<rect width="1000" height="260" fill="url(#bg)"/>
<g stroke="#ff2a6d" stroke-opacity=".45" stroke-width="1"><line x1="100" y1="150" x2="-1100" y2="260" /><line x1="140" y1="150" x2="-940" y2="260" /><line x1="180" y1="150" x2="-780" y2="260" /><line x1="220" y1="150" x2="-620" y2="260" /><line x1="260" y1="150" x2="-460" y2="260" /><line x1="300" y1="150" x2="-300" y2="260" /><line x1="340" y1="150" x2="-140" y2="260" /><line x1="380" y1="150" x2="20" y2="260" /><line x1="420" y1="150" x2="180" y2="260" /><line x1="460" y1="150" x2="340" y2="260" /><line x1="500" y1="150" x2="500" y2="260" /><line x1="540" y1="150" x2="660" y2="260" /><line x1="580" y1="150" x2="820" y2="260" /><line x1="620" y1="150" x2="980" y2="260" /><line x1="660" y1="150" x2="1140" y2="260" /><line x1="700" y1="150" x2="1300" y2="260" /><line x1="740" y1="150" x2="1460" y2="260" /><line x1="780" y1="150" x2="1620" y2="260" /><line x1="820" y1="150" x2="1780" y2="260" /><line x1="860" y1="150" x2="1940" y2="260" /><line x1="900" y1="150" x2="2100" y2="260" /><line x1="0" y1="160" x2="1000" y2="160" /><line x1="0" y1="172" x2="1000" y2="172" /><line x1="0" y1="188" x2="1000" y2="188" /><line x1="0" y1="210" x2="1000" y2="210" /><line x1="0" y1="240" x2="1000" y2="240" /></g>
<circle cx="500" cy="150" r="70" fill="#ff003c" opacity=".18" filter="url(#glow)"/>
<g class="g">
<text class="t" x="506" y="125" fill="#05d9e8" opacity=".8">RAYYAN AFROZ</text>
<text class="t" x="494" y="121" fill="#ff003c" opacity=".9">RAYYAN AFROZ</text>
<text class="t" x="500" y="123" fill="#fff" filter="url(#glow)">RAYYAN AFROZ</text>
</g>
<text class="s" x="500" y="168" fill="#ff2a6d">// PASSIONATE ABOUT TECH :: BUILDING THINGS THAT MATTER<tspan class="bl" fill="#05d9e8"> █</tspan></text>
<rect class="sc" x="0" y="0" width="1000" height="14" fill="#05d9e8" opacity=".07"/>
<rect width="1000" height="260" fill="url(#sl)"/>
<g fill="none" stroke="#05d9e8" stroke-width="3"><path d="M14 52V14H52"/><path d="M986 52V14H948"/></g>
<g fill="none" stroke="#ff003c" stroke-width="3"><path d="M14 208V246H52"/><path d="M986 208V246H948"/></g>
<rect x="0" y="256" width="1000" height="4" fill="url(#ln)"/><rect x="0" y="0" width="1000" height="3" fill="url(#ln)"/>
</svg>